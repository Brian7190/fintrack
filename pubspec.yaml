name: fintrack
description: "A new Flutter project."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# Version and build number
version: 1.0.1+2

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  intl: ^0.20.2
  fl_chart: ^1.2.0
  go_router: 17.5.0

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  # Preferencias locales
  shared_preferences: ^2.5.5

  # Servicios externos
  url_launcher: ^6.3.3

  # Google
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  http: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  google_sign_in_web: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon/fintrack_icon.png"

  adaptive_icon_background: "#0B2A25"
  adaptive_icon_foreground: "assets/icon/fintrack_icon.png"

  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icon/fintrack_icon.png"
    background_color: "#0B2A25"
    theme_color: "#0B2A25"